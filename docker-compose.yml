services:
  mariadb:
    image: mariadb:10.11
    container_name: pmoc_gestor_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pmoc_root_password_2026}
      MYSQL_DATABASE: ${DB_NAME:-pmoc_db}
      MYSQL_USER: ${DB_USER:-pmoc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pmoc_password_2026}
    volumes:
      - mariadb_data:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pmoc_network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pmoc_gestor_api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
    volumes:
      - ./public/js/data:/public/js/data:ro,z
    networks:
      - pmoc_network

  web:
    image: nginx:alpine
    container_name: pmoc_gestor_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro,z
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    environment:
      - TZ=America/Bahia
    networks:
      - pmoc_network

volumes:
  mariadb_data:
    driver: local

networks:
  pmoc_network:
    driver: bridge
